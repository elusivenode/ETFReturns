name: Refresh ETF Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *" # 05:00 AEST (approx, no DST adjustment)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Refresh cache and generate artifacts
        run: python scripts/run_refresh.py

      - name: Generate performance artifact (if performance portfolio exists)
        run: |
          PORTFOLIO_ID=$(python - <<'PY'
          import sqlite3

          conn = sqlite3.connect('data/sqlite/etf_cache.db')
          try:
              row = conn.execute('SELECT id FROM portfolio ORDER BY id LIMIT 1').fetchone()
              print(row[0] if row else '')
          finally:
              conn.close()
          PY
          )

          if [ -n "$PORTFOLIO_ID" ]; then
            echo "Generating performance artifact for portfolio: $PORTFOLIO_ID"
            python scripts/run_performance.py \
              --portfolio-id "$PORTFOLIO_ID" \
              --benchmark-code CPI_PLUS_5_TOTAL \
              --calculation-version refresh-data
          else
            echo "No performance portfolio found in SQLite; skipping performance artifact generation."
          fi

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artifacts/latest
          git diff --cached --quiet || git commit -m "chore(data): refresh ETF artifacts"
          git push
