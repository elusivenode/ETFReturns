name: Refresh ETF Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *" # 05:00 AEST (approx, no DST adjustment)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Refresh cache and generate artifacts
        run: python scripts/run_refresh.py

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artifacts/latest
          git diff --cached --quiet || git commit -m "chore(data): refresh ETF artifacts"
          git push
