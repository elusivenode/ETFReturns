name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Ensure latest artifacts are in public data
        run: |
          mkdir -p apps/web/public/data
          cp data/artifacts/latest/metrics.json apps/web/public/data/
          cp data/artifacts/latest/period_metrics.json apps/web/public/data/
          cp data/artifacts/latest/price_series.json apps/web/public/data/
          cp data/artifacts/latest/cpi_series.json apps/web/public/data/ || true

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
